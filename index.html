<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiplication Fluency</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#19354a;background:#f1f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:0 auto;padding:24px 16px 60px}h1{font-size:clamp(1.8rem,5vw,2.5rem);margin:8px 0}h2{font-size:1.4rem}p{line-height:1.5}.muted{color:#5e7080}.card{background:#fff;border:1px solid #dbe5ec;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 3px 15px #15324a0b}button,input{font:inherit}button{border:0;border-radius:12px;background:#176eac;color:white;font-weight:700;padding:14px 20px;cursor:pointer;min-height:48px}button.secondary{background:#e8f0f7;color:#245574}button:disabled{opacity:.5}button:focus-visible,input:focus-visible{outline:3px solid #e0a63e;outline-offset:3px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.level{padding:18px 8px;background:#e7eff6;color:#173d59}.level.selected{background:#176eac;color:#fff}.level strong{display:block;font-size:1.65rem}.center{text-align:center}.equation{font-size:clamp(2.6rem,10vw,5rem);font-weight:800;margin:28px 0}.answer{width:160px;max-width:100%;font-size:2rem;text-align:center;padding:12px;border:2px solid #9cb4c5;border-radius:12px}.bar{height:12px;background:#e5edf3;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#2a997e;transition:width .15s}.pill{display:inline-block;background:#e6f1f8;padding:5px 10px;border-radius:30px;font-size:.8rem;font-weight:700}.correct{color:#168565}.notice{background:#fff3d6;padding:12px;border-radius:10px}.hidden{display:none}.bigstat{font-size:2.4rem;font-weight:800}.small{font-size:.86rem}@media(max-width:400px){.card{padding:18px}.level{font-size:.9rem;padding:14px 3px}}
</style></head><body><main><header><span class="pill">CLASSROOM PRACTICE</span><h1>Multiplication Fluency</h1><p class="muted">A quick check, then focused practice. You choose your level!</p></header><div id="app"></div></main>
<script>
const $=s=>document.querySelector(s),app=$('#app'),levels=[{label:'0–4',desc:'Facts with 0–4',test:(a,b)=>a<=4},{label:'5–7',desc:'New facts with 5–7',test:(a,b)=>a>=5&&a<=7},{label:'8–9',desc:'New facts with 8–9',test:(a,b)=>a>=8}];
const facts=[];for(let a=0;a<=9;a++)for(let b=a;b<=9;b++)facts.push({a,b,key:a+'x'+b,product:a*b});
let recentPractice=[],level=0,phase='home',phaseStart=0,phaseLength=0,clock=null,current=null,askedAt=0,locked=false,history=[],results={},practiceCount=0,practiceFluent=0,practiceCorrect=0,sessionEnd=false,practiceQueue=[],correction=false,diagnosticCount=0,checkFluent=0,checkCorrect=0;
function pool(){return facts.filter(f=>levels[level].test(f.a,f.b))}
function shuffle(xs){let a=[...xs];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){clearInterval(clock);phase='home';app.innerHTML=`<section class="card"><h2>Choose your level</h2><div class="levels">${levels.map((x,i)=>`<button class="level ${i===level?'selected':''}" data-level="${i}"><strong>${x.label}</strong><span class="small">${x.desc}</span></button>`).join('')}</div><p class="muted small">Your teacher will tell you which level to practice. Every level includes review of earlier facts during practice.</p><div class="center" style="margin-top:22px"><button id="start">Start today's practice</button></div></section><section class="card"><strong>Today's plan</strong><p>1. Two-minute fact check</p><p>2. Five-minute practice with help when you need it</p><p>3. Show your teacher your results</p></section>`;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);home()});$('#start').onclick=startCheck}
function beginPhase(name,seconds){phase=name;phaseLength=seconds;phaseStart=performance.now();sessionEnd=false;clearInterval(clock);clock=setInterval(tick,100)}
function remaining(){return Math.max(0,phaseLength-(performance.now()-phaseStart)/1000)}
function shell(title){return `<section class="card"><div class="row" style="justify-content:space-between"><span class="pill">${title}</span><span class="muted small">${level===0?'0–4':level===1?'5–7':'8–9'}</span></div><div class="bar" style="margin:14px 0"><div class="fill" id="progress"></div></div><div id="activity"></div></section>`}
function tick(){let bar=$('#progress');if(bar)bar.style.width=(100*(1-remaining()/phaseLength))+'%';if(remaining()<=0&&!sessionEnd){sessionEnd=true;if(phase==='check'){clearInterval(clock);checkDone()}else if(phase==='practice'){clearInterval(clock);finish()}}else if(current&&!locked&&phase==='check'&&(performance.now()-askedAt)>=5000)submit(true)}
function startCheck(){history=shuffle(pool());recentPractice=[];results={};diagnosticCount=0;checkCorrect=0;checkFluent=0;practiceCount=0;practiceCorrect=0;practiceFluent=0;beginPhase('check',120);app.innerHTML=shell('2-minute fact check');nextCheck()}
function nextCheck(){if(remaining()<=0){checkDone();return}if(!history.length)history=shuffle(pool());current=history.shift();locked=false;correction=false;drawQuestion()}
function drawQuestion(){let a=$('#activity');a.innerHTML=`<div class="equation center">${current.a} × ${current.b} = ?</div><div class="center"><input id="answer" class="answer" type="number" inputmode="numeric" autocomplete="off" aria-label="Answer"><div class="row" style="justify-content:center;margin-top:16px"><button id="submit">Submit</button><button class="secondary" id="idk">I don't know</button>${phase==='practice'?'<button class="secondary" id="help">Help</button>':''}</div></div>`;askedAt=performance.now();$('#submit').onclick=()=>submit(false);$('#idk').onclick=()=>submit(true);if($('#help'))$('#help').onclick=()=>submit(true,true);$('#answer').onkeydown=e=>{if(e.key==='Enter')submit(false)};$('#answer').focus()}
function submit(skip=false,help=false){if(locked||sessionEnd)return;let val=$('#answer')?.value;if(!skip&&(val===''||val==null))return;locked=true;let secs=(performance.now()-askedAt)/1000,correct=!skip&&Number(val)===current.product,fluent=correct&&secs<=3,key=current.key;
if(phase==='check'){diagnosticCount++;if(correct)checkCorrect++;if(fluent)checkFluent++;let r=results[key]??={attempts:0,fluent:0,wrong:0};r.attempts++;if(fluent)r.fluent++;else r.wrong++;nextCheck();return}
practiceCount++;if(correct)practiceCorrect++;if(fluent)practiceFluent++;let r=results[key]??={attempts:0,fluent:0,wrong:0};r.attempts++;if(fluent)r.fluent++;else r.wrong++;
if(fluent){$('#activity').innerHTML='<div class="equation center correct">✓</div>';setTimeout(()=>{if(phase==='practice'&&!sessionEnd)nextPractice()},320)}
else{correction=true;$('#activity').innerHTML=`<h2 class="center">${help?'Here is some help':'Let’s learn this fact'}</h2><div class="equation center">${current.a} × ${current.b} = ${current.product}</div><p class="center">${current.a} groups of ${current.b} make ${current.product}.</p><p class="center">Type the correct product to continue.</p><div class="center"><input id="correction" class="answer" type="number" inputmode="numeric" aria-label="Correct answer"><div style="margin-top:14px"><button id="continue">Continue</button></div><p id="hint" class="muted small"></p></div>`;$('#continue').onclick=()=>{if($('#correction').value!==''&&Number($('#correction').value)===current.product){correction=false;nextPractice()}else $('#hint').textContent='Look at the equation above and try again.'};$('#correction').onkeydown=e=>{if(e.key==='Enter')$('#continue').click()};$('#correction').focus()}}
function checkDone(){clearInterval(clock);phase='between';current=null;app.innerHTML=`<section class="card center"><h2>Fact check complete!</h2><p>Now let's practice the facts that need the most work.</p><p class="muted">Check: ${checkFluent} fluent out of ${diagnosticCount} attempts</p><button id="go">Start 5-minute practice</button></section>`;$('#go').onclick=startPractice}
function startPractice(){beginPhase('practice',300);app.innerHTML=shell('5-minute practice');practiceQueue=[];nextPractice()}
function nextPractice(){
if(remaining()<=0){finish();return}
const base=pool(), review=level>0?facts.filter(f=>!levels[level].test(f.a,f.b)):[];
// Prioritize errors and slow answers from the check. Fluent facts still get spaced review.
// Prevent a fact from appearing twice within the last four opportunities when possible.
const candidates=[...base,...review];
let available=candidates.filter(f=>!recentPractice.includes(f.key));
if(!available.length)available=candidates;
const weight=f=>{
  const r=results[f.key];
  const isReview=!levels[level].test(f.a,f.b);
  const zero=f.a===0;
  if(isReview)return .18;
  if(!r)return zero?.35:2.0;
  const difficulty=(r.wrong||0)*3+(r.attempts-r.fluent)*1.2;
  const mastery=r.attempts>0&&r.fluent===r.attempts;
  return (zero?.3:1)*(mastery?.28:1)*(1+difficulty);
};
let total=available.reduce((sum,f)=>sum+weight(f),0),roll=Math.random()*total;
let pick=available[available.length-1];
for(const f of available){roll-=weight(f);if(roll<=0){pick=f;break}}
current=pick;recentPractice.push(pick.key);if(recentPractice.length>4)recentPractice.shift();
locked=false;drawQuestion()
}
function finish(){clearInterval(clock);phase='done';sessionEnd=true;current=null;let weak=pool().filter(f=>(results[f.key]?.wrong||0)>0).sort((a,b)=>(results[b.key]?.wrong||0)-(results[a.key]?.wrong||0)).slice(0,6);app.innerHTML=`<section class="card center"><h2>Great work today! 🎉</h2><p>Level ${levels[level].label} practice complete</p><div class="row" style="justify-content:center;gap:30px"><div><div class="bigstat">${checkFluent}/${diagnosticCount}</div><div class="muted small">Fluent in check</div></div><div><div class="bigstat">${practiceFluent}/${practiceCount}</div><div class="muted small">Fluent in practice</div></div></div><p class="muted small">Fluent = correct independently in 3 seconds or less. Practice includes repeats and review facts.</p>${weak.length?`<div class="notice" style="margin:20px 0"><strong>Facts to keep practicing</strong><p>${weak.map(f=>`${f.a} × ${f.b}`).join(' · ')}</p></div>`:''}<p>Show this screen to your teacher.</p><button id="again">Back to levels</button></section>`;$('#again').onclick=home}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(phase==='check'||phase==='practice')){clearInterval(clock);let left=remaining();phaseLength=left;phaseStart=performance.now();let prior=phase;phase='paused';app.innerHTML=`<section class="card center"><h2>Practice paused</h2><p>Return to this tab and select Resume.</p><button id="resume">Resume</button></section>`;$('#resume').onclick=()=>{phase=prior;phaseStart=performance.now();app.innerHTML=shell(prior==='check'?'2-minute fact check':'5-minute practice');if(prior==='check')nextCheck();else nextPractice();clock=setInterval(tick,100)}}});
home();
</script></body></html>
